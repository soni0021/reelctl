[workspace]
resolver = "2"
members = [
    "crates/edit-dna",
    "crates/decompile",
    "crates/diff",
    "crates/filmstrip",
    "crates/look",
    "crates/understand",
    "crates/timeline",
    "crates/reelctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
ffmpeg-next = "9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
whisper-rs = "0.16"
